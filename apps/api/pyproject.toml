[project]
name = "api"
version = "0.1.0"
description = "Ops Intelligence Agent API"
requires-python = ">=3.14"
dependencies = [
  "fastapi (>=0.139.0,<0.140.0)",
  "uvicorn[standard] (>=0.50.0,<0.51.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
