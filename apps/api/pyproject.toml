[project]
name = "api"
version = "0.1.0"
description = "Ops Intelligence Agent API"
requires-python = ">=3.14,<4.0"
dependencies = [
  "fastapi (>=0.139.0,<0.140.0)",
  "uvicorn[standard] (>=0.50.0,<0.51.0)",
  "sqlalchemy (>=2.0.51,<2.1.0)",
  "alembic (>=1.18.5,<1.19.0)",
  "psycopg[binary] (>=3.3.4,<3.4.0)",
  "python-dotenv (>=1.2.2,<1.3.0)",
  "anthropic (>=0.116.0,<0.117.0)",
  "sqlglot (>=30.12.0,<31.0.0)",
  "sentence-transformers (>=5.6.0,<5.7.0)",
  "pgvector (>=0.5.0,<0.6.0)",
  "slowapi (>=0.1.10,<0.2.0)",
  "httpx (>=0.28.0,<0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
jsonschema = "^4.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
